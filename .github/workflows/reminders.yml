name: Renewal reminders

# Dubai is UTC+4, so these fire at 12:00, 15:00 and 18:00 local time.
# The 15:00 and 18:00 rounds only send when something expires that day.
on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 11 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call the reminder endpoint
        run: |
          curl -fsS --retry 3 --retry-delay 30 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/reminders"
